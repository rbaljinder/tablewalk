# tablewalk.dev: the database browser's documentation, built into site/dist/ and its links checked on pull requests and
# pushes to main; deployed only from a push to main (or a manual run).
#
# The site is a package of its own (site/package.json), so this job installs only it: the root project's dependencies
# are a database browser's, and the docs need none of them.
#
# Deploying needs a token this repository may not have. Rather than fail when it is absent, the job builds, says what
# is missing and stops — so the site deploys the moment CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added as
# secrets, and a red cross does not sit beside every commit for a deployment that was never going to happen.
name: site
on:
  push:
    branches: [main]
    paths: ['site/**', 'package.json', '.github/workflows/site.yml']
  # A broken link should fail the pull request that breaks it, not the push to main after it.
  pull_request:
    paths: ['site/**', 'package.json', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
# Per ref, so a pull request's run never cancels the deploy that a push to main is making.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: site

      # A broken internal link or anchor fails this step (starlight-links-validator).
      - name: Build and validate the documentation site
        run: npm run build:site

      - name: Is there a token to deploy with?
        id: have
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required; the site was built but not deployed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.have.outputs.yes == 'true' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: npx --yes wrangler@4 pages deploy site/dist --project-name tablewalk --branch "$DEPLOY_BRANCH"
